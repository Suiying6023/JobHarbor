# All relative paths resolve against this configuration file.
database: private/source.sqlite3
mobile:
  session_file: private/mobile/session.local.json
  proxy: null
  egress_label: mobile
  interval_seconds: [35, 55]
  batch_requests: [10, 14]
  batch_pause_seconds: [360, 480]
anonymous:
  profile: private/browser-anonymous
  proxy: null
  egress_label: anonymous
  driver: patchright
  channel: chrome
  headless: false
  interval_seconds: [15, 17]
  batch_pause_seconds: [15, 19]
  batch_requests: 12
