[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-harbor"
version = "0.4.1"
description = "BOSS job data CLI and Python API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8", "PyYAML>=6.0", "lz4>=4.4", "PySocks>=1.7.1"]

[project.optional-dependencies]
browser = ["patchright>=1.64.4"]

[project.scripts]
boss-data = "boss_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
